<rect x="56" y="72" width="728" height="1" fill="#E2DACB"/>
<rect x="56" y="416" width="728" height="1" fill="#E2DACB"/>
<text x="56" y="51" font-family="Plus Jakarta Sans" font-size="9" font-weight="700" fill="#6E8078" letter-spacing="3">BAB II · IDENTITAS UTAMA</text>
<text x="766" y="50" font-family="Archivo" font-size="15" font-weight="700" fill="#6E8078">07</text>
<text x="56" y="111" font-family="Plus Jakarta Sans" font-size="9" font-weight="700" fill="#6E8078" letter-spacing="3">BAGIAN 01</text>
<text x="56" y="162" font-family="Archivo" font-size="46" font-weight="700" fill="#12332C" letter-spacing="-2">Logogram</text>
<text x="56" y="206" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#6E8078">Satu bentuk, dibaca dua arah: sarang yang menampung,</text><text x="56" y="225" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#6E8078">dan barang yang kembali ke tengahnya.</text>
<text x="56" y="439" font-family="Plus Jakarta Sans" font-size="9" font-weight="700" fill="#12332C" letter-spacing="3">LAMBANG INI MENGGABUNGKAN TIGA GAGASAN</text>
<text x="56" y="528" font-family="Archivo" font-size="15" font-weight="700" fill="#12332C">Sel sarang</text>
<text x="56" y="551" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">Satu warga, satu sel. Komunitas</text><text x="56" y="567" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">dibangun dari orang yang mau repot</text><text x="56" y="584" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">sedikit.</text>
<text x="308" y="528" font-family="Archivo" font-size="15" font-weight="700" fill="#12332C">Sel emas di tengah</text>
<text x="308" y="551" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">Barang yang kembali. Selalu emas, tidak</text><text x="308" y="567" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">pernah warna lain.</text>
<text x="560" y="528" font-family="Archivo" font-size="15" font-weight="700" fill="#12332C">Heksagon terbuka</text>
<text x="560" y="551" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">Bergaris, bukan padat — komunitas yang</text><text x="560" y="567" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">masih bisa dimasuki.</text>
