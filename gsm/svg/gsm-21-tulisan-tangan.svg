<g transform="rotate(-2 421 310)"><text x="230" y="288" font-family="Caveat" font-size="62" font-weight="600" fill="#0B4638">Small things make</text><text x="260" y="355" font-family="Caveat" font-size="62" font-weight="600" fill="#0B4638">a big difference</text></g>
