<text x="56" y="111" font-family="Plus Jakarta Sans" font-size="9" font-weight="700" fill="#6E8078" letter-spacing="3">BAGIAN 07</text>
<text x="56" y="160" font-family="Archivo" font-size="44" font-weight="700" fill="#12332C" letter-spacing="-2">Tulisan</text>
<text x="200" y="160" font-family="Archivo" font-size="44" font-weight="400" fill="#12332C" letter-spacing="-2">tangan</text>
<text x="591" y="125" font-family="Plus Jakarta Sans" font-size="9" font-weight="700" fill="#6E8078" letter-spacing="3">CAVEAT · 600 · MIRING −3°</text>
<rect x="56" y="436" width="228" height="92" rx="16" fill="#F2ECE1"/>
<text x="74" y="459" font-family="Plus Jakarta Sans" font-size="9" font-weight="700" fill="#6E8078" letter-spacing="2">SATU PER MATERI</text>
<text x="74" y="487" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#12332C">Cukup sekali di tiap lembar. Dua kali</text><text x="74" y="503" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#12332C">jadi ramai.</text>
<rect x="299" y="436" width="228" height="92" rx="16" fill="#F2ECE1"/>
<text x="317" y="459" font-family="Plus Jakarta Sans" font-size="9" font-weight="700" fill="#6E8078" letter-spacing="2">SELALU MIRING</text>
<text x="317" y="487" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#12332C">Putaran −6° sampai −2°. Tidak</text><text x="317" y="503" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#12332C">pernah lurus.</text>
<rect x="542" y="436" width="228" height="92" rx="16" fill="#F2ECE1"/>
<text x="560" y="459" font-family="Plus Jakarta Sans" font-size="9" font-weight="700" fill="#6E8078" letter-spacing="2">WARNA</text>
<text x="560" y="487" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#12332C">Teal tua, emas, atau krem. Tidak</text><text x="560" y="503" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#12332C">pernah terakota.</text>
