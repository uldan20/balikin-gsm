<text x="56" y="51" font-family="Plus Jakarta Sans" font-size="9" font-weight="700" fill="#6E8078" letter-spacing="3">BAB II · IDENTITAS UTAMA</text>
<text x="766" y="50" font-family="Archivo" font-size="15" font-weight="700" fill="#6E8078">08</text>
<text x="56" y="111" font-family="Plus Jakarta Sans" font-size="9" font-weight="700" fill="#6E8078" letter-spacing="3">BAGIAN 02</text>
<text x="56" y="162" font-family="Archivo" font-size="46" font-weight="700" fill="#12332C" letter-spacing="-2">Konstruksi</text>
<text x="56" y="206" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#6E8078">Semua ukuran diturunkan dari satu satuan X —</text><text x="56" y="225" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#6E8078">setengah lebar heksagon. Tidak ada angka yang</text><text x="56" y="245" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#6E8078">dikarang.</text>
<text x="56" y="298" font-family="Archivo" font-size="15" font-weight="700" fill="#12332C">Satuan X</text>
<text x="56" y="322" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">Setengah lebar heksagon. Semua jarak kelipatan X.</text>
<text x="56" y="374" font-family="Archivo" font-size="15" font-weight="700" fill="#12332C">Sudut 60°</text>
<text x="56" y="398" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">Kisi isometrik. Tidak ada sudut lain di dalam logo.</text>
<text x="56" y="450" font-family="Archivo" font-size="15" font-weight="700" fill="#12332C">Tebal garis</text>
<text x="56" y="474" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">X ÷ 6. Ikut mengecil kalau logonya mengecil.</text>
<text x="56" y="544" font-family="Plus Jakarta Sans" font-size="9" font-weight="700" fill="#C05C33" letter-spacing="3">JANGAN MENGGAMBAR ULANG — PAKAI BERKAS VEKTOR</text>
</svg>
