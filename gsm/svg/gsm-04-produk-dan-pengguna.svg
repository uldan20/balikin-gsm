<text x="479" y="510" font-family="Plus Jakarta Sans" font-size="8" font-weight="700" fill="#6E8078" letter-spacing="2">PLACEHOLDER — GANTI TANGKAPAN LAYAR ASLI</text>
<rect x="56" y="72" width="728" height="1" fill="#E2DACB"/>
<text x="56" y="51" font-family="Plus Jakarta Sans" font-size="9" font-weight="700" fill="#6E8078" letter-spacing="3">BAB I · TENTANG BALIKIN</text>
<text x="766" y="50" font-family="Archivo" font-size="15" font-weight="700" fill="#6E8078">04</text>
<text x="56" y="111" font-family="Plus Jakarta Sans" font-size="9" font-weight="700" fill="#6E8078" letter-spacing="3">BAGIAN 01</text>
<text x="56" y="162" font-family="Archivo" font-size="46" font-weight="700" fill="#12332C" letter-spacing="-2">Produk</text>
<text x="56" y="205" font-family="Archivo" font-size="46" font-weight="400" fill="#12332C" letter-spacing="-2">dan pengguna</text>
<text x="56" y="249" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#6E8078">Aplikasi lost and found untuk warga Sukabumi. Penemu</text><text x="56" y="268" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#6E8078">melapor, pemilik mencari, keduanya bertemu di titik aman</text><text x="56" y="288" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#6E8078">yang disepakati.</text>
<text x="112" y="332" font-family="Archivo" font-size="15" font-weight="700" fill="#12332C">Melapor kehilangan</text>
<text x="112" y="355" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">Empat langkah, dua menit.</text>
<text x="112" y="408" font-family="Archivo" font-size="15" font-weight="700" fill="#12332C">Melapor temuan</text>
<text x="112" y="431" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">Foto, kategori, titik lokasi.</text>
<text x="112" y="484" font-family="Archivo" font-size="15" font-weight="700" fill="#12332C">Reputasi komunitas</text>
<text x="112" y="507" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">Poin dan lencana, bukan uang.</text>
