<text x="766" y="50" font-family="Archivo" font-size="15" font-weight="700" fill="#6E8078">20</text>
<text x="472" y="103" font-family="Plus Jakarta Sans" font-size="9" font-weight="700" fill="#6E8078" letter-spacing="3">BAGIAN 06</text>
<text x="472" y="151" font-family="Archivo" font-size="42" font-weight="700" fill="#12332C" letter-spacing="-2">Maskot</text>
<text x="472" y="191" font-family="Caveat" font-size="48" font-weight="600" fill="#12332C">Lebah Sarang</text>
<text x="472" y="244" font-family="Archivo" font-size="15" font-weight="700" fill="#12332C">Kapan dipakai</text>
<text x="472" y="268" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">Materi yang ramah: stiker, standee, x-banner. Tidak pernah di</text><text x="472" y="285" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">dalam antarmuka aplikasi.</text>
<text x="472" y="330" font-family="Archivo" font-size="15" font-weight="700" fill="#12332C">Ukuran minimum</text>
<text x="472" y="354" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">20 mm cetak. Di bawah itu sayapnya hilang.</text>
<text x="472" y="416" font-family="Archivo" font-size="15" font-weight="700" fill="#12332C">Larangan</text>
<text x="472" y="440" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">Jangan diubah warnanya, jangan diberi mulut lain, jangan</text><text x="472" y="457" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">dipakai sebagai logo.</text>
