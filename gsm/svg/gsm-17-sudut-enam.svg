FE6E0" stroke="#1B7A63" stroke-width="6" stroke-linejoin="miter"></path><path d="M345 213H441V373H345Z" fill="none" stroke="#C05C33" stroke-width="2" stroke-dasharray="7 6"></path><path d="M371 213H441V347L415 373H345V239Z" fill="#FBF8F3" stroke="#C05C33" stroke-width="6" stroke-linejoin="miter"></path><text x="393" y="407" font-family="'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="700" fill="#C05C33" text-anchor="middle">SUDUT DIPANGKAS</text><text x="221" y="407" font-family="'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="700" fill="#1B7A63" text-anchor="middle">KISI 60°</text>
<text x="131" y="461" font-family="Plus Jakarta Sans" font-size="9" font-weight="700" fill="#6E8078" letter-spacing="2">BAHASA BENTUK — SUDUT ENAM (HEXCUT)</text>
<rect x="56" y="72" width="728" height="1" fill="#E2DACB"/>
<text x="56" y="51" font-family="Plus Jakarta Sans" font-size="9" font-weight="700" fill="#6E8078" letter-spacing="3">BAB III · ELEMEN VISUAL</text>
<text x="766" y="50" font-family="Archivo" font-size="15" font-weight="700" fill="#6E8078">17</text>
<text x="488" y="111" font-family="Plus Jakarta Sans" font-size="9" font-weight="700" fill="#6E8078" letter-spacing="3">BAGIAN 03</text>
<text x="488" y="160" font-family="Archivo" font-size="44" font-weight="700" fill="#12332C" letter-spacing="-2">Sudut</text>
<text x="609" y="160" font-family="Archivo" font-size="44" font-weight="400" fill="#12332C" letter-spacing="-2">Enam</text>
<text x="488" y="204" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#6E8078">Bahasa bentuk Balikin: kisi 60°, sudut dipangkas</text><text x="488" y="223" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#6E8078">bukan dibulatkan, sambungan mitre.</text>
<text x="488" y="280" font-family="Archivo" font-size="15" font-weight="700" fill="#12332C">Pangkas, jangan bulatkan</text>
<text x="488" y="304" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">Radius membulat tidak dipakai di grafis identitas.</text><text x="488" y="321" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">Antarmuka aplikasi boleh membulat — dua bahasa, dua</text><text x="488" y="338" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">tugas.</text>
<text x="488" y="368" font-family="Archivo" font-size="15" font-weight="700" fill="#12332C">Sambungan mitre</text>
<text x="488" y="392" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">Semua sudut garis bertemu tajam, tidak pernah round.</text>
<text x="488" y="456" font-family="Archivo" font-size="15" font-weight="700" fill="#12332C">Besar pangkasan</text>
<text x="488" y="480" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">Seperenam sisi terpendek, dibulatkan ke bilangan bulat.</text>
</svg>
