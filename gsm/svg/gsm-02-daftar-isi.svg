<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148mm" viewBox="0 0 840 592" role="img" aria-label="GSM Balikin — 02 Daftar isi">
<title>GSM Balikin — 02 Daftar isi</title>
<desc>A5 lanskap 210 x 148 mm, 4 satuan = 1 mm. Huruf: Archivo, Plus Jakarta Sans, Caveat.</desc>
<defs></defs>
<rect x="0" y="0" width="840" height="592" fill="#FBF8F3"/>
<rect x="0" y="0" width="840" height="592" fill="#FBF8F3"/>
<g opacity="0.05"><g fill="none"><path d="M848 131L1108 304V650L848 824L588 650V304Z" fill="#1B7A63" stroke="none" stroke-width="0" stroke-linejoin="miter"></path></g></g>
<rect x="56" y="72" width="728" height="1" fill="#E2DACB"/>
<text x="56" y="51" font-family="Plus Jakarta Sans" font-size="9" font-weight="700" fill="#6E8078" letter-spacing="3">BALIKIN · GRAPHIC STANDARD MANUAL</text>
<text x="766" y="50" font-family="Archivo" font-size="15" font-weight="700" fill="#6E8078">02</text>
<text x="56" y="158" font-family="Archivo" font-size="58" font-weight="700" fill="#12332C" letter-spacing="-2">Daftar</text>
<text x="56" y="212" font-family="Archivo" font-size="58" font-weight="400" fill="#12332C" letter-spacing="-2">Isi</text>
<text x="56" y="276" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#6E8078">Manual ini mengunci cara memakai identitas</text><text x="56" y="295" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#6E8078">Balikin — apa yang boleh, apa yang tidak,</text><text x="56" y="315" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#6E8078">dan kenapa.</text>
<rect x="348" y="104" width="436" height="1" fill="#E2DACB"/>
<text x="348" y="149" font-family="Archivo" font-size="30" font-weight="700" fill="#1B7A63" letter-spacing="-1">I</text>
<text x="412" y="142" font-family="Archivo" font-size="22" font-weight="700" fill="#12332C" letter-spacing="0">Tentang Balikin</text>
<text x="412" y="167" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">Produk, pengguna, tagline, dan kepribadian.</text>
<text x="743" y="137" font-family="Plus Jakarta Sans" font-size="11" font-weight="700" fill="#6E8078" letter-spacing="1">03–05</text>
<rect x="348" y="210" width="436" height="1" fill="#E2DACB"/>
<text x="348" y="255" font-family="Archivo" font-size="30" font-weight="700" fill="#0F5A48" letter-spacing="-1">II</text>
<text x="412" y="248" font-family="Archivo" font-size="22" font-weight="700" fill="#12332C" letter-spacing="0">Identitas Utama</text>
<text x="412" y="273" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">Logogram, konstruksi, ruang aman, ukuran, konfigurasi,</text><text x="412" y="289" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">warna, larangan.</text>
<text x="746" y="243" font-family="Plus Jakarta Sans" font-size="11" font-weight="700" fill="#6E8078" letter-spacing="1">06–13</text>
<rect x="348" y="316" width="436" height="1" fill="#E2DACB"/>
<text x="348" y="361" font-family="Archivo" font-size="30" font-weight="700" fill="#C8952E" letter-spacing="-1">III</text>
<text x="412" y="354" font-family="Archivo" font-size="22" font-weight="700" fill="#12332C" letter-spacing="0">Elemen Visual</text>
<text x="412" y="379" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">Palet, huruf, Sudut Enam, ikon, pola, maskot, tulisan</text><text x="412" y="395" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">tangan.</text>
<text x="749" y="349" font-family="Plus Jakarta Sans" font-size="11" font-weight="700" fill="#6E8078" letter-spacing="1">14–21</text>
<rect x="348" y="422" width="436" height="1" fill="#E2DACB"/>
<text x="348" y="467" font-family="Archivo" font-size="30" font-weight="700" fill="#C05C33" letter-spacing="-1">IV</text>
<text x="412" y="460" font-family="Archivo" font-size="22" font-weight="700" fill="#12332C" letter-spacing="0">Penerapan</text>
<text x="412" y="485" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">Layar, cetak, merchandise, dan meja pameran.</text>
<text x="745" y="455" font-family="Plus Jakarta Sans" font-size="11" font-weight="700" fill="#6E8078" letter-spacing="1">22–24</text>
<rect x="348" y="528" width="436" height="1" fill="#E2DACB"/>
<g fill="none"><path d="M71 509L82 516V532L71 538L60 532V516Z" stroke="#1B7A63" stroke-width="1" stroke-linejoin="miter"></path><path d="M74 522L72 525H70L68 522L70 519H72Z" fill="#C8952E"></path></g>
<text x="100" y="528" font-family="Plus Jakarta Sans" font-size="9" font-weight="700" fill="#6E8078" letter-spacing="3">24 HALAMAN · A5 LANSKAP 210 × 148 MM</text>
</svg>
