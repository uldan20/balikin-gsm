<text x="148" y="463" font-family="Plus Jakarta Sans" font-size="9" font-weight="700" fill="#C05C33" letter-spacing="2">RUANG AMAN = 1X DI SEMUA SISI</text>
<rect x="56" y="72" width="728" height="1" fill="#E2DACB"/>
<text x="56" y="51" font-family="Plus Jakarta Sans" font-size="9" font-weight="700" fill="#6E8078" letter-spacing="3">BAB II · IDENTITAS UTAMA</text>
<text x="766" y="50" font-family="Archivo" font-size="15" font-weight="700" fill="#6E8078">09</text>
<text x="472" y="111" font-family="Plus Jakarta Sans" font-size="9" font-weight="700" fill="#6E8078" letter-spacing="3">BAGIAN 03</text>
<text x="472" y="162" font-family="Archivo" font-size="46" font-weight="700" fill="#12332C" letter-spacing="-2">Ruang</text>
<text x="612" y="162" font-family="Archivo" font-size="46" font-weight="400" fill="#12332C" letter-spacing="-2">aman</text>
<text x="472" y="206" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#6E8078">Tidak ada apa pun di dalam kotak putus-putus: teks,</text><text x="472" y="225" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#6E8078">gambar, tepi kertas, atau logo lain.</text>
<text x="472" y="294" font-family="Archivo" font-size="15" font-weight="700" fill="#12332C">Satu X di semua sisi</text>
<text x="472" y="318" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">Kalau logonya membesar, ruang amannya ikut membesar.</text><text x="472" y="335" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">Perbandingan tidak pernah berubah.</text>
<text x="472" y="406" font-family="Archivo" font-size="15" font-weight="700" fill="#12332C">Di atas foto</text>
<text x="472" y="430" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">Pakai bidang warna solid di belakang logo. Jangan menaruh</text><text x="472" y="447" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#6E8078">logo langsung di atas foto ramai.</text>
</svg>
