<g transform="rotate(-6 162 967)"><rect x="91" y="935" width="142" height="64" rx="31" fill="#FBF8F3"/><rect x="96" y="940" width="132" height="54" rx="26" fill="#211C16" filter="url(#f13)"/><text x="118" y="972" font-family="Archivo" font-size="22" font-weight="700" fill="#FBF8F3">Ketemu!</text></g>
<g transform="rotate(8 963 1005)"><rect x="885" y="973" width="156" height="64" rx="31" fill="#FBF8F3"/><rect x="890" y="978" width="146" height="54" rx="26" fill="#C8952E" filter="url(#f14)"/><text x="912" y="1010" font-family="Archivo" font-size="22" font-weight="700" fill="#211C16">+150 poin</text></g>
<g transform="rotate(-3 561 1202)"><text x="468" y="1217" font-family="Caveat" font-size="62" font-weight="700" fill="#F3D77C">Sekilas</text></g>
<text x="201" y="1283" font-family="Archivo" font-size="26" font-weight="700" fill="#FBF8F3">Kehilangan barang tidak harus berakhir di grup WhatsApp</text><text x="400" y="1318" font-family="Archivo" font-size="26" font-weight="700" fill="#FBF8F3">yang tidak ada yang baca.</text>
<text x="70" y="1374" font-family="Plus Jakarta Sans" font-size="16" font-weight="400" fill="#FBF8F3" fill-opacity="0.78">Balikin mempertemukan pemilik dan penemu lewat satu</text><text x="70" y="1398" font-family="Plus Jakarta Sans" font-size="16" font-weight="400" fill="#FBF8F3" fill-opacity="0.78">sistem: laporan yang tersimpan, pencocokan otomatis,</text><text x="70" y="1422" font-family="Plus Jakarta Sans" font-size="16" font-weight="400" fill="#FBF8F3" fill-opacity="0.78">verifikasi ciri rahasia, dan serah terima di titik aman. Yang</text><text x="70" y="1446" font-family="Plus Jakarta Sans" font-size="16" font-weight="400" fill="#FBF8F3" fill-opacity="0.78">menolong mendapat poin dan lencana — bukan uang.</text>
<text x="584" y="1374" font-family="Plus Jakarta Sans" font-size="16" font-weight="400" fill="#FBF8F3" fill-opacity="0.78">Balikin connects owners and finders in one system:</text><text x="584" y="1398" font-family="Plus Jakarta Sans" font-size="16" font-weight="400" fill="#FBF8F3" fill-opacity="0.78">reports that persist, automatic matching, secret-detail</text><text x="584" y="1422" font-family="Plus Jakarta Sans" font-size="16" font-weight="400" fill="#FBF8F3" fill-opacity="0.78">verification, and handover at safe points. Helpers earn</text><text x="584" y="1446" font-family="Plus Jakarta Sans" font-size="16" font-weight="400" fill="#FBF8F3" fill-opacity="0.78">points and badges — not cash.</text>
<g opacity="0.6"><text x="70" y="1502" font-family="Plus Jakarta Sans" font-size="15" font-weight="400" fill="#FBF8F3">Uldan Pamungkas · 20210060127</text><text x="70" y="1524" font-family="Plus Jakarta Sans" font-size="15" font-weight="400" fill="#FBF8F3">Desain Komunikasi Visual · Universitas Nusa Putra Sukabumi</text></g>
